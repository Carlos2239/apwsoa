<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate - Expedia SOA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="index.html" class="navbar-soa">Expedia SOA</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="main-card">
            <h3>Crea tu cuenta</h3>
            <p class="text-muted">Forma parte de SOA</p>

            <form action="auth.php" method="POST" class="text-start mt-4">
                
                <input type="hidden" name="action" value="register">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Elige un nombre de usuario" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="tu.email@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Crea una contraseña segura" required>
                </div>

                <button type="submit" class="btn btn-expedia">Registrarse</button>
            </form>

            <hr>
            <p class="text-muted">¿Ya tienes cuenta? 
                <a href="login.html" class="fw-bold">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
