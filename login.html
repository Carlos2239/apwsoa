<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Expedia SOA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="contenedor">
            <a href="index.html" class="navbar-soa">Expedia SOA</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="main-card">
            <h3>Iniciar Sesión</h3>
            <p class="subtitle">¡Bienvenido de vuelta!</p>
            
            <form action="auth.php" method="POST" class="mt-4">
                
                <input type="hidden" name="action" value="login">

                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-expedia w-100 mt-2">Iniciar Sesión</button>
            </form>

            <div class="footer-links">
                <p class="text-muted">¿No tienes cuenta? 
                    <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</body>
</html>
