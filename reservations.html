<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes - Expedia SOA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a href="index.html" class="navbar-soa">Expedia SOA</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white fw-bold" href="search.html">Buscar vuelos</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4" style="color: var(--expedia-blue); font-weight: 800;">Mis Viajes</h2>

        <div class="main-card-wide mt-3 shadow-sm">
            <h3 class="mb-4">Tus reservaciones activas</h3>

            <div class="table-responsive">
                <table class="table-expedia w-100">
                    <thead>
                        <tr>
                            <th>ID Reserva</th>
                            <th>Ruta</th>
                            <th>Fecha de Salida</th>
                            <th>Precio</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="reservationsBody">
                        <tr>
                            <td colspan="5" class="text-center py-3">Cargando tus viajes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 text-center">
                <a href="search.html" class="btn btn-outline-primary">← Reservar otro vuelo</a>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Obtener el ID del usuario guardado al iniciar sesión
        const userId = localStorage.getItem('user_id');

        // Si no hay usuario, mandar al login
        if (!userId) {
            window.location.href = 'login.html';
            return;
        }

        // 2. Pedir las reservas al servidor
        const formData = new FormData();
        formData.append('user_id', userId);

        fetch('manage_reservations.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('reservationsBody');
            tbody.innerHTML = ''; // Limpiar mensaje de carga

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Aún no tienes reservaciones. ¡Ve a buscar un vuelo!</td></tr>';
                return;
            }

            // 3. Dibujar cada reserva en la tabla
            data.forEach(res => {
                const row = `
                    <tr class="align-middle flight-row">
                        <td class="fw-bold">#SOA-${res.reservation_id}</td>
                        <td>
                            <strong class="text-primary">${res.origin} → ${res.destination}</strong>
                        </td>
                        <td>${res.departure_date}</td>
                        <td class="text-success fw-bold">$${res.price}</td>
                        <td><span class="badge bg-success">Confirmado</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('reservationsBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error al cargar reservaciones.</td></tr>';
        });
    });
    </script>
</body>
</html>
